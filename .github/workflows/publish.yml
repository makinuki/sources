# Continuous registry pipeline: every master push rebuilds the plugin
# catalog and republishes makinuki.github.io. Per-source releases use the
# separate tag-triggered release workflow instead.

name: publish-registry

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v1
        with:
          version: 11.22.0
          runtime: node@24

      - name: install wasm toolchain (extism-js)
        run: |
          curl -fsSL -o install-extism.sh https://raw.githubusercontent.com/extism/js-pdk/main/install.sh
          bash install-extism.sh v1.6.0
          extism-js --version

      - name: install workspace deps
        working-directory: sources
        run: pnpm install --frozen-lockfile

      - name: build plugins
        working-directory: sources
        run: pnpm build

      - name: conformance tests
        working-directory: sources
        run: pnpm test

      - name: generate registry index
        working-directory: sources
        run: pnpm generate-index

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sources/dist

  deploy:
    needs: build
    uses: ./.github/workflows/deploy-registry.yml
    secrets: inherit
